<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>put it online</title>
<style>
  :root{ --bg:#f8f7f4; --ink:#1c1c1c; --soft:#6b6b6b; --line:#e4e2dc; --card:#fff; --accent:#2f5bea; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
       padding:48px max(16px,env(safe-area-inset-left)) 64px max(16px,env(safe-area-inset-right))}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:clamp(36px,6vw,56px);letter-spacing:-.02em;margin:0 0 6px;line-height:1}
  .sub{color:var(--soft);margin:0 0 32px;font-size:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  a.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;
         overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #0001}
  a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .thumb{aspect-ratio:4/3;background:#eee;position:relative;overflow:hidden;max-width:100%}
  .thumb iframe{position:absolute;top:0;left:0;width:400%;height:400%;border:0;transform:scale(.25);transform-origin:0 0;pointer-events:none}
  .meta{padding:12px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .num{color:var(--soft);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
  .empty{color:var(--soft)}
</style>
<div class="wrap">
  <h1>put it online</h1>
  <p class="sub" id="sub">Everything hosted here.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
// Builds itself from the repo on every visit, so each new upload shows up on its own.
// The upload app appends "- [slug](link)" to README.md in upload order; that's the list.
const OWNER = "kokokosal", REPO = "putitonline", BRANCH = "main";
const grid = document.getElementById("grid"), sub = document.getElementById("sub");

async function fromReadme(){
  const r = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/README.md?t=${Date.now()}`);
  if(!r.ok) throw new Error("readme " + r.status);
  const slugs = [...(await r.text()).matchAll(/^- \[([a-z0-9-]+)\]\(/gm)].map(m=>m[1]);
  if(!slugs.length) throw new Error("no entries");
  return [...new Set(slugs)].reverse();
}
async function fromFolders(){
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents?ref=${BRANCH}`);
  if(!r.ok) throw new Error("api " + r.status);
  return (await r.json()).filter(f=>f.type === "dir" && !f.name.startsWith(".")).map(f=>f.name);
}

function render(slugs){
  sub.textContent = `${slugs.length} ${slugs.length === 1 ? "site" : "sites"} hosted here, newest first.`;
  grid.innerHTML = "";
  slugs.forEach((slug, i)=>{
    const a = document.createElement("a");
    a.className = "card"; a.href = `./${slug}/`;
    a.innerHTML = `<div class="thumb"></div><div class="meta"><span class="name"></span></div>`;
    a.querySelector(".name").textContent = slug;
    grid.appendChild(a);
    // live preview, loaded only when the card scrolls into view
    io.observe(a);
  });
}
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(!e.isIntersecting) return;
  io.unobserve(e.target);
  const f = document.createElement("iframe");
  f.src = e.target.getAttribute("href"); f.loading = "lazy"; f.tabIndex = -1; f.setAttribute("aria-hidden","true");
  f.setAttribute("sandbox", "allow-scripts allow-same-origin");
  e.target.querySelector(".thumb").appendChild(f);
}), {rootMargin:"200px"});

// Every folder in the repo is a site. README order (newest last) puts them newest first;
// older sites from before the README list come after, A to Z.
(async ()=>{
  const [folders, ordered] = await Promise.all([fromFolders().catch(()=>null), fromReadme().catch(()=>[])]);
  if(!folders && !ordered.length){
    grid.innerHTML = '<p class="empty">Couldn\'t load the list right now. Refresh in a minute.</p>';
    return;
  }
  if(!folders) return render(ordered);
  const have = new Set(folders);
  const first = ordered.filter(s=>have.has(s));
  const rest = folders.filter(s=>!first.includes(s)).sort();
  render([...first, ...rest]);
})();
</script>
</html>
